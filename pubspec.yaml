name: daily_consume
description: Account-based Android app for server-stored body, meal, spending and workout records.
publish_to: none
version: 1.3.4+11

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  image_cropper: ^12.2.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/release_notes.json
    - assets/release_history.json
    - assets/server_ca.pem
    - assets/branding/rem_logo.png
