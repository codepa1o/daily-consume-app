limit_req_zone $binary_remote_addr zone=daily_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=daily_api:10m rate=10r/s;
server {
    listen 443 ssl;
    server_name 47.99.142.117;
    ssl_certificate /etc/daily-consume/server.crt;
    ssl_certificate_key /etc/daily-consume/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/api/v1/(auth/(login|register)|couple/(join|invite/preview))$ {
        limit_req zone=daily_auth burst=20 nodelay;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/v1/ {
        limit_req zone=daily_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
    location / { return 404; }
}
